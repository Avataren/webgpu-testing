[package]
name = "wgpu-cube"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[lib]
name = "wgpu_cube"
crate-type = ["cdylib", "rlib"]

[features]
default = ["navigation"]
wasm = []
# Navmesh generation, path finding and crowds of walking agents (src/navigation).
navigation = []
egui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:egui_tiles", "dep:epaint_default_fonts"]
profile = ["dep:once_cell"]
optimized-allocator = []

[dependencies]
winit = "0.30"
pollster = "0.3"
wgpu = "30.0"
glam = "0.28"
bytemuck = { version = "1.23", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
bitflags = "2.4"
# Runtime formats only; native builds add the rest below for editor imports.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
hecs = "0.10"
slotmap = "1.0"
gltf = { version = "1.4", features = ["KHR_materials_transmission", "KHR_materials_ior", "extensions"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }
base64 = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
rand = { version = "0.8", features = ["small_rng"] }
half = "2.4"
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "serialize"] }
thiserror = "1.0"
toml = "0.8"
naga = { version = "30", features = ["wgsl-in"] }
# Rigid-body physics, character controllers and scene queries (pure Rust, builds for wasm).
rapier3d = "0.36"
# Native builds add egui's default fonts below; the web player installs only the text fonts.
egui = { version = "0.36", optional = true, default-features = false }
# Default features would also enable wgpu's WebGL backend, which the engine never uses.
egui-wgpu = { version = "0.36", optional = true, default-features = false, features = ["fragile-send-sync-non-atomic-wasm", "macos-window-resize-jitter-fix"] }
egui-winit = { version = "0.36", optional = true, default-features=false }
once_cell = { version = "1.21", optional = true }
egui_tiles = { version = "0.17", optional = true }
# The audio mixer (buses, voices, effects), shared with the another_synth DAW.
# .cargo/config.toml may patch it to a local checkout of cubed-synth.
cubed-mixer = { git = "https://github.com/Avataren/cubed-synth" }

[[bin]]
name = "editor"
path = "src/bin/editor/main.rs"
required-features = ["egui"]

[[bin]]
name = "player"
path = "src/bin/player/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "HtmlCanvasElement",
    "Element",
    "HtmlElement",
    "Node",
    "CssStyleDeclaration",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
    "EventTarget",
    "Response",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioBuffer",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "MessageEvent",
    "MessagePort",
    "Worklet",
    "Storage",
] }
epaint_default_fonts = { version = "0.36", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", features = ["default-formats", "rayon"] }
egui = { version = "0.36", optional = true, features = ["default_fonts"] }
rfd = "0.15"
notify = "8.2"
# RenderDoc's in-application API for `renderdoc.capture` (both already come with wgpu).
libloading = "0.8"
renderdoc-sys = "1.1"
# Native audio output (cpal) for the mixer, and decoding of sound files.
cubed-mixer = { git = "https://github.com/Avataren/cubed-synth", features = ["native"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }

[dev-dependencies]
tempfile = "3.10"

# Size-optimized release build for wasm downloads (build_web.sh); slower to link.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"



# Vendored crates patched for wasm32-unknown-unknown; see third_party/*/README.md.
# lua-src cannot build Lua for that target; the copy builds it against a minimal libc.
[patch.crates-io]
lua-src = { path = "third_party/lua-src" }
# egui-winit 0.36.2 does not compile for wasm32 (missing DroppedFile::bytes_async).
egui-winit = { path = "third_party/egui-winit" }
