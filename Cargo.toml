[package]
name = "wgpu-cube"
version = "0.1.0"
edition = "2021"

[lib]
name = "wgpu_cube"
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = []
egui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:egui_tiles"]
profile = ["dep:once_cell"]
optimized-allocator = []

[dependencies]
winit = "0.30"
pollster = "0.3"
wgpu = "27.0"
glam = "0.28"
bytemuck = { version = "1.23", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
bitflags = "2.4"
image = "0.25"
hecs = "0.10"
gltf = "1.4"
instant = { version = "0.1", features = ["wasm-bindgen"] }
base64 = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
rand = { version = "0.8", features = ["small_rng"] }
half = "2.4"
rune = { version = "0.13.2", features = ["std"] }
egui = { version = "0.33", optional = true }
egui-wgpu = { version = "0.33", optional = true }
egui-winit = { version = "0.33", optional = true, default-features=false }
once_cell = { version = "1.21", optional = true }
egui_tiles = { version = "0.14", optional = true }

[[bin]]
name = "editor"
path = "src/bin/editor/main.rs"
required-features = ["egui"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "HtmlCanvasElement",
    "Element",
    "HtmlElement",
    "Node",
    "CssStyleDeclaration",
    "XmlHttpRequest",
    "XmlHttpRequestResponseType",
] }


