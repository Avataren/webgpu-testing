# Engine UI Plugin Manifest
# This file declares UI plugins that should be loaded by the editor.
#
# Each plugin is a Lua script with @editor annotation that provides
# editor functionality through the UI scripting system.

# Welcome Screen - VSCode-style project launcher
[[plugin]]
name = "Welcome Screen"
script = "welcome_screen.lua"
description = "Welcome screen with quick actions for opening/creating projects"
category = "Core"
plugin_type = "editor"
enabled = true
default_visible = true

# Minimal test plugin for debugging
[[plugin]]
name = "Minimal Test"
script = "test_minimal_ui.lua"
description = "Minimal UI test script for debugging"
category = "Debug"
plugin_type = "user"
enabled = true
default_visible = false

# Script Editor - Edit script files directly in the editor
[[plugin]]
name = "Script Editor"
script = "script_editor_plugin.lua"
description = "Basic script editor for editing Lua script files"
category = "Development"
plugin_type = "editor"
enabled = false
default_visible = false

# Simple Text Editor - General purpose text editor
[[plugin]]
name = "Text Editor"
script = "simple_text_editor.lua"
description = "Simple text editor with file I/O support"
category = "Development"
plugin_type = "editor"
enabled = true
default_visible = false

# Disabled plugins for now while we fix the scripting issues
[[plugin]]
name = "Scene Statistics"
script = "scene_stats_panel.rn"
description = "Real-time scene statistics panel showing entity counts and component usage"
category = "Debug"
plugin_type = "editor"
enabled = false
default_visible = true

[[plugin]]
name = "Quick Actions"
script = "quick_actions_panel.rn"
description = "Quick access panel for common editor operations like spawning entities and creating lights"
category = "Workflow"
plugin_type = "editor"
enabled = false
default_visible = true

[[plugin]]
name = "Debug Console"
script = "debug_console_plugin.rn"
description = "Interactive debug console with command execution and performance monitoring"
category = "Debug"
plugin_type = "editor"
enabled = false
default_visible = false

[[plugin]]
name = "Character Editor"
script = "character_editor_tool.rn"
description = "Example tool for editing character properties with various widgets"
category = "Examples"
plugin_type = "user"
enabled = false
default_visible = false

[[plugin]]
name = "Advanced Widgets Demo"
script = "advanced_widgets_example.rn"
description = "Demonstration of all available UI widget types"
category = "Examples"
plugin_type = "user"
enabled = false
default_visible = false

