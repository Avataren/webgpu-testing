[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renderdoc-mcp"
version = "0.4.0"
description = "MCP server for analyzing RenderDoc frame captures (.rdc) of the engine"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
renderdoc-mcp = "renderdoc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/renderdoc_mcp"]
